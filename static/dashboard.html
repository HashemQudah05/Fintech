<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Agricultural Financing Intelligence — ACC Jordan</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root, [data-theme="light"]{
  --bg:#eef3ec; --card:#ffffff; --ink:#1f2a1f; --ink-soft:#5a6b5a; --line:#dde7da;
  --brand:#0f6b33; --brand-deep:#0a3a1e; --brand-soft:#dff0e0; --gold:#c8a24b;
  --good:#1e7b3c; --warn:#c8a24b; --bad:#b54141; --info:#5b8fb9;
  --hdr-ink:#ffffff; --shadow:0 1px 3px rgba(15,55,25,.10);
  --pal:#1e7b3c,#c8a24b,#5b8fb9,#d97b4f,#7a5ea8,#3e8e8c,#b54141,#8b5e3c;
}
[data-theme="dark"]{
  --bg:#101710; --card:#1b241c; --ink:#e8f0e6; --ink-soft:#9aad98; --line:#2c3a2d;
  --brand:#0d3d1f; --brand-deep:#07240f; --brand-soft:#20301f; --gold:#e0be6a;
  --good:#4cc474; --warn:#e0be6a; --bad:#e06666; --info:#7faedd;
  --hdr-ink:#e8f0e6; --shadow:0 1px 4px rgba(0,0,0,.45);
  --pal:#4cc474,#e0be6a,#7faedd,#f09a6e,#b39ddb,#63b8b4,#e06666,#c08a5e;
}
[data-theme="cb"]{
  --bg:#f7f7f5; --card:#ffffff; --ink:#1a1a1a; --ink-soft:#4d4d4d; --line:#dcdcd8;
  --brand:#00654a; --brand-deep:#00402e; --brand-soft:#d6efe7; --gold:#e69f00;
  --good:#009e73; --warn:#e69f00; --bad:#0072b2; --info:#56b4e9;
  --hdr-ink:#ffffff; --shadow:0 1px 3px rgba(0,0,0,.12);
  --pal:#009e73,#0072b2,#e69f00,#56b4e9,#cc79a7,#d55e00,#8a8a8a,#f0e442;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Tahoma,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
body[dir="rtl"]{font-family:Tahoma,"Segoe UI",system-ui,sans-serif}
header{background:linear-gradient(135deg,var(--brand-deep),var(--brand));color:var(--hdr-ink);
  padding:10px 22px 12px;border-bottom:4px solid var(--gold);position:sticky;top:0;z-index:50}
.hrow{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{width:52px;height:52px;border-radius:8px;background:#fff;padding:3px;flex:none}
.htitle h1{font-size:21px;font-weight:700;line-height:1.15}
.htitle p{font-size:12.5px;opacity:.9;margin-top:2px}
.hcontrols{margin-inline-start:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hcontrols select{background:rgba(255,255,255,.13);color:var(--hdr-ink);border:1px solid rgba(255,255,255,.35);
  border-radius:6px;padding:6px 8px;font-size:12px;cursor:pointer;max-width:175px}
.hcontrols select option{color:#1f2a1f;background:#fff}
.btn-ghost{background:transparent;color:var(--hdr-ink);border:1px solid rgba(255,255,255,.4);border-radius:6px;
  padding:6px 10px;font-size:12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn-ghost:hover{background:rgba(255,255,255,.15)}
.seg{display:flex;border:1px solid rgba(255,255,255,.45);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:none;color:var(--hdr-ink);padding:6px 11px;font-size:12px;cursor:pointer}
.seg button.active{background:var(--gold);color:#1f2a1f;font-weight:700}
nav.tabs{display:flex;gap:8px;padding:12px 22px 0;align-items:center}
.tabs .tab{background:var(--card);border:1px solid var(--line);border-bottom:3px solid transparent;color:var(--ink-soft);
  padding:9px 18px;border-radius:8px 8px 0 0;font-size:13.5px;font-weight:600;cursor:pointer}
.tabs .tab.active{border-bottom-color:var(--gold);color:var(--ink)}
.pgnav{margin-inline-start:auto;display:flex;gap:6px}
.pgnav button{background:var(--card);border:1px solid var(--line);border-radius:8px;width:38px;height:34px;font-size:16px;
  color:var(--ink);cursor:pointer;box-shadow:var(--shadow)}
.pgnav button:hover{border-color:var(--gold)}
main{padding:14px 22px 30px;max-width:1600px;margin:0 auto}
.page{display:none}.page.active{display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--card);border-radius:10px;box-shadow:var(--shadow);padding:12px 14px;border-top:4px solid var(--good)}
.kpi.k-info{border-top-color:var(--info)}.kpi.k-warn{border-top-color:var(--warn)}.kpi.k-bad{border-top-color:var(--bad)}
.kpi .lbl{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-soft);font-weight:700}
body[dir="rtl"] .kpi .lbl{letter-spacing:0}
.kpi .val{font-size:25px;font-weight:800;margin:3px 0 1px}
.kpi .sub{font-size:11px;color:var(--ink-soft)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.card{background:var(--card);border-radius:10px;box-shadow:var(--shadow);padding:14px 16px}
.card h3{font-size:14.5px;font-weight:700;margin-bottom:2px}
.card .cap{font-size:11px;color:var(--ink-soft);margin-bottom:8px}
.chartbox{position:relative;height:280px}
.tall .chartbox{height:400px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c6{grid-column:span 6}.c4{grid-column:span 4}
@media(max-width:1100px){.c8,.c6,.c4{grid-column:span 12}}
table.loans{width:100%;border-collapse:collapse;font-size:11.5px}
table.loans th{text-align:start;color:var(--ink-soft);border-bottom:2px solid var(--line);padding:6px 8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px}
body[dir="rtl"] table.loans th{letter-spacing:0}
table.loans td{border-bottom:1px solid var(--line);padding:6px 8px}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10.5px;font-weight:700;color:#fff}
footer{padding:0 22px 26px;max-width:1600px;margin:0 auto;font-size:11px;color:var(--ink-soft)}
</style>
</head>

const tr=k=>T[k][LANG];
const LBL={gov:()=>LANG=='en'?DB.gov:DB.govAr, pt:()=>LANG=='en'?DB.pt:DB.ptAr,
 inv:()=>LANG=='en'?DB.inv:DB.invAr, irr:()=>LANG=='en'?DB.irr:DB.irrAr,
 reg:()=>LANG=='en'?DB.reg:DB.regAr, land:()=>LANG=='en'?DB.land:DB.landAr,
 crop:()=>LANG=='en'?DB.crop:DB.cropAr, status:()=>LANG=='en'?DB.status:DB.statusAr,
 risk:()=>LANG=='en'?DB.risk:DB.riskAr, mn:()=>LANG=='en'?MN_EN:MN_AR};

/* ===== filters ===== */
function fillFilters(){
  const selM=$('fMonth'),selG=$('fGov'),selP=$('fPt');
  const keep=[F.m,F.g,F.p];
  selM.innerHTML='';selG.innerHTML='';selP.innerHTML='';
  selM.add(new Option(tr('fMonthAll'),''));
  LBL.mn().forEach((m,i)=>selM.add(new Option(m,i+1)));
  selG.add(new Option(tr('fGovAll'),''));
  LBL.gov().map((g,i)=>[g,i]).sort((a,b)=>a[0].localeCompare(b[0],LANG)).forEach(([g,i])=>selG.add(new Option(g,i)));
  selP.add(new Option(tr('fPtAll'),''));
  LBL.pt().map((p,i)=>[p,i]).sort((a,b)=>a[0].localeCompare(b[0],LANG)).forEach(([p,i])=>selP.add(new Option(p,i)));
  [selM.value,selG.value,selP.value]=keep;
}
function rowsF(){return DB.rows.filter(r=>(F.m===""||r[M]==F.m)&&(F.g===""||r[GOV]==F.g)&&(F.p===""||r[PTY]==F.p));}
const sum=(rs,i)=>rs.reduce((a,r)=>a+r[i],0);
function groupSum(rs,ki,vi){const o={};rs.forEach(r=>{o[r[ki]]=(o[r[ki]]||0)+(vi==null?1:r[vi]);});return o;}
function mkChart(id,cfg){if(charts[id])charts[id].destroy();charts[id]=new Chart($(id),cfg);}
function base(extra){return Object.assign({responsive:true,maintainAspectRatio:false,
  plugins:{legend:{labels:{color:css('--ink'),boxWidth:12,font:{size:11}}}}},extra||{});}
function ax(o){return Object.assign({ticks:{color:css('--ink-soft'),font:{size:10.5}},grid:{color:css('--line')}},o||{});}
function kpi(el,items){$(el).innerHTML=items.map(k=>
 `<div class="kpi ${k.c||''}"><div class="lbl">${k.l}</div><div class="val">${k.v}</div><div class="sub">${k.s}</div></div>`).join('');}
const fmtMm=v=>"JD "+(v/1e6).toFixed(1)+"M";

/* ===== Page 1 — mirrors Power BI page 1 ===== */
function renderP0(rs){
  const app=sum(rs,APP),col=sum(rs,COL),n=rs.length;
  const prot=rs.reduce((a,r)=>a+Math.max(0,r[APP]-r[REC]),0);
  kpi('kpi0',[
   {l:tr('k_app'),v:fmtMm(app),s:n.toLocaleString()+' '+tr('s_loans')},
   {l:tr('k_loans'),v:n.toLocaleString(),s:new Set(rs.map(r=>r[GOV])).size+' '+tr('s_govs'),c:'k-info'},
   {l:tr('k_risk'),v:(n?Math.round(sum(rs,RS)/n):0)+'/100',s:tr('s_scale'),c:'k-warn'},
   {l:tr('k_rep'),v:app?(col/app*100).toFixed(1)+'%':'—',s:tr('s_colvap')},
   {l:tr('k_prot'),v:fmtMm(prot),s:tr('s_prev'),c:'k-bad'}]);
  const P=pal(), mn=LBL.mn();
  const byM=Array.from({length:12},(_,i)=>rs.filter(r=>r[M]==i+1));
  mkChart('c_trend',{type:'line',data:{labels:mn,datasets:[
   {label:LANG=='en'?'Approved':'الموافَق عليه',data:byM.map(a=>sum(a,APP)/1e6),borderColor:P[0],backgroundColor:P[0],tension:.3,pointRadius:2},
   {label:LANG=='en'?'Requested':'المطلوب',data:byM.map(a=>sum(a,REQ)/1e6),borderColor:P[1],backgroundColor:P[1],tension:.3,pointRadius:2}]},
   options:base({scales:{x:ax(),y:ax()}})});
  const inv=groupSum(rs,INVC,APP);
  mkChart('c_invdonut',{type:'doughnut',data:{labels:LBL.inv(),datasets:[{data:DB.inv.map((_,i)=>inv[i]||0),backgroundColor:P,borderColor:css('--card'),borderWidth:2}]},
   options:base({cutout:'58%',plugins:{legend:{position:LANG=='ar'?'left':'right',labels:{color:css('--ink'),boxWidth:11,font:{size:10.5}}}}})});
  const govApp=groupSum(rs,GOV,APP);
  const order=Object.keys(govApp).sort((a,b)=>govApp[b]-govApp[a]);
  mkChart('c_gov',{type:'bar',data:{labels:order.map(i=>LBL.gov()[i]),datasets:[{data:order.map(i=>govApp[i]/1e6),backgroundColor:P[0],borderRadius:4}]},
   options:base({indexAxis:'y',plugins:{legend:{display:false}},scales:{x:ax(),y:ax({grid:{display:false}})}})});
  const regs=DB.reg.map((_,ri)=>rs.filter(r=>r[REGI]==ri));
  mkChart('c_reggen',{type:'bar',data:{labels:LBL.reg(),datasets:[
   {label:LANG=='en'?'Male':'ذكور',data:regs.map(a=>a.filter(r=>!r[GEN]).length),backgroundColor:P[0],borderRadius:3},
   {label:LANG=='en'?'Female':'إناث',data:regs.map(a=>a.filter(r=>r[GEN]).length),backgroundColor:P[1],borderRadius:3}]},
   options:base({scales:{x:Object.assign(ax(),{stacked:true}),y:Object.assign(ax(),{stacked:true})}})});
}

/* ===== Page 2 — mirrors Power BI page 2 ===== */
function renderP1(rs){
  const n=rs.length,pc=sum(rs,PC),app=sum(rs,APP);
  kpi('kpi1',[
   {l:tr('k_area'),v:(sum(rs,FA)/1000).toFixed(1)+'K du',s:tr('s_dunum')},
   {l:tr('k_cost'),v:'JD '+(n?Math.round(pc/n):0).toLocaleString(),s:tr('s_perproj'),c:'k-info'},
   {l:tr('k_cov'),v:pc?(app/pc*100).toFixed(0)+'%':'—',s:tr('s_avsc'),c:'k-warn'},
   {l:tr('k_ftb'),v:n?(rs.filter(r=>r[FTB]).length/n*100).toFixed(0)+'%':'—',s:tr('s_new')},
   {l:tr('k_fem'),v:n?(rs.filter(r=>r[GEN]).length/n*100).toFixed(0)+'%':'—',s:tr('s_ofall'),c:'k-info'}]);
  const P=pal();
  const hbar=(id,labels,vals)=>mkChart(id,{type:'bar',data:{labels,datasets:[{data:vals,backgroundColor:P[0],borderRadius:4}]},
   options:base({indexAxis:'y',plugins:{legend:{display:false}},scales:{x:ax(),y:ax({grid:{display:false}})}})});
  const ptApp=groupSum(rs,PTY,APP);
  const ptOrd=Object.keys(ptApp).sort((a,b)=>ptApp[b]-ptApp[a]).slice(0,14);
  hbar('c_pt',ptOrd.map(i=>LBL.pt()[i]),ptOrd.map(i=>ptApp[i]/1e6));
  const crApp=groupSum(rs,CRP,APP);
  const crOrd=Object.keys(crApp).sort((a,b)=>crApp[b]-crApp[a]).slice(0,10);
  hbar('c_crop',crOrd.map(i=>LBL.crop()[i]),crOrd.map(i=>crApp[i]/1e6));
  const irr=groupSum(rs,IRRI,null);
  mkChart('c_irr',{type:'doughnut',data:{labels:LBL.irr(),datasets:[{data:DB.irr.map((_,i)=>irr[i]||0),backgroundColor:P,borderColor:css('--card'),borderWidth:2}]},
   options:base({cutout:'55%',plugins:{legend:{position:'bottom',labels:{color:css('--ink'),boxWidth:10,font:{size:10}}}}})});
  const land=groupSum(rs,LND,null);
  mkChart('c_land',{type:'bar',data:{labels:LBL.land(),datasets:[{data:DB.land.map((_,i)=>land[i]||0),backgroundColor:P[2],borderRadius:4}]},
   options:base({plugins:{legend:{display:false}},scales:{x:ax({grid:{display:false}}),y:ax()}})});
}

/* ===== Page 3 — mirrors Power BI page 3 ===== */
function renderP2(rs){
  const n=rs.length,app=sum(rs,APP),rec=sum(rs,REC);
  const defN=rs.filter(r=>r[ST]==2).length;
  kpi('kpi2',[
   {l:tr('k_risk'),v:(n?Math.round(sum(rs,RS)/n):0)+'/100',s:tr('s_avg'),c:'k-warn'},
   {l:tr('k_high'),v:n?(rs.filter(r=>r[RK]==2).length/n*100).toFixed(0)+'%':'—',s:tr('s_ofapps'),c:'k-bad'},
   {l:tr('k_def'),v:n?(defN/n*100).toFixed(1)+'%':'—',s:tr('s_indef'),c:'k-bad'},
   {l:tr('k_ovf'),v:n?(rs.filter(r=>r[OVF]).length/n*100).toFixed(0)+'%':'—',s:tr('s_reqel'),c:'k-warn'},
   {l:tr('k_aired'),v:app?((app-rec)/app*100).toFixed(1)+'%':'—',s:'JD '+((app-rec)/1e6).toFixed(1)+'M '+tr('s_trim')}]);
  const RC=[css('--good'),css('--warn'),css('--bad')],P=pal();
  const byRisk=DB.risk.map((_,ri)=>rs.filter(r=>r[RK]==ri));
  mkChart('c_defrisk',{type:'bar',data:{labels:LBL.risk(),datasets:[{data:byRisk.map(a=>a.length?+(a.filter(r=>r[ST]==2).length/a.length*100).toFixed(1):0),backgroundColor:RC,borderRadius:4}]},
   options:base({plugins:{legend:{display:false}},scales:{x:ax({grid:{display:false}}),y:ax()}})});
  const irrOrd=DB.irr.map((_,i)=>i).filter(i=>rs.some(r=>r[IRRI]==i));
  mkChart('c_riskirr',{type:'bar',data:{labels:irrOrd.map(i=>LBL.irr()[i]),datasets:DB.risk.map((_,ri)=>({label:LBL.risk()[ri],
    data:irrOrd.map(i=>rs.filter(r=>r[IRRI]==i&&r[RK]==ri).length),backgroundColor:RC[ri],borderRadius:3}))},
   options:base({indexAxis:'y',scales:{x:Object.assign(ax(),{stacked:true}),y:Object.assign(ax({grid:{display:false}}),{stacked:true})}})});
  const mn=LBL.mn(), stCol=[css('--good'),css('--warn'),css('--bad'),P[2]];
  mkChart('c_stmonth',{type:'bar',data:{labels:mn,datasets:DB.status.map((_,si)=>({label:LBL.status()[si],
    data:Array.from({length:12},(_,i)=>rs.filter(r=>r[M]==i+1&&r[ST]==si).length),backgroundColor:stCol[si],borderRadius:2}))},
   options:base({scales:{x:Object.assign(ax({grid:{display:false}}),{stacked:true}),y:Object.assign(ax(),{stacked:true})}})});
  const invApp=groupSum(rs,INVC,APP),invRec=groupSum(rs,INVC,REC);
  mkChart('c_aigap',{type:'bar',data:{labels:DB.inv.map((_,i)=>LBL.inv()[i].split(' ')[0]),datasets:[
   {label:LANG=='en'?'Approved':'الموافَق عليه',data:DB.inv.map((_,i)=>(invApp[i]||0)/1e6),backgroundColor:P[0],borderRadius:3},
   {label:LANG=='en'?'AI Recommended':'توصية الذكاء الاصطناعي',data:DB.inv.map((_,i)=>(invRec[i]||0)/1e6),backgroundColor:P[2],borderRadius:3}]},
   options:base({scales:{x:ax({grid:{display:false}}),y:ax()}})});
  /* table — Late & Default, top outstanding */
  const bad=rs.filter(r=>r[ST]==1||r[ST]==2).sort((a,b)=>b[OUT]-a[OUT]).slice(0,12);
  const pc2=(ri)=>['var(--good)','var(--warn)','var(--bad)'][ri];
  $('loanTable').innerHTML=
   `<tr><th>${tr('th_id')}</th><th>${tr('th_gov')}</th><th>${tr('th_proj')}</th><th>${tr('th_risk')}</th><th>${tr('th_status')}</th><th>${tr('th_out')}</th></tr>`+
   bad.map(r=>`<tr><td>${r[AID]}</td><td>${LBL.gov()[r[GOV]]}</td><td>${LBL.pt()[r[PTY]]}</td>`+
    `<td><span class="pill" style="background:${pc2(r[RK])}">${LBL.risk()[r[RK]]}</span></td>`+
    `<td><span class="pill" style="background:${r[ST]==2?'var(--bad)':'var(--warn)'}">${LBL.status()[r[ST]]}</span></td>`+
    `<td>${r[OUT].toLocaleString()}</td></tr>`).join('');
  const atRisk=DB.risk.map((_,ri)=>rs.filter(r=>r[RK]==ri&&(r[ST]==1||r[ST]==2)).reduce((a,r)=>a+r[OUT],0)/1e6);
  mkChart('c_atrisk',{type:'bar',data:{labels:LBL.risk(),datasets:[{data:atRisk,backgroundColor:RC,borderRadius:4}]},
   options:base({plugins:{legend:{display:false}},scales:{x:ax({grid:{display:false}}),y:ax()}})});
}

const RENDER=[renderP0,renderP1,renderP2];
function applyStatic(){
  $('t_title').textContent=tr('title'); $('t_sub').textContent=tr('sub');
  $('btnReset').textContent=tr('reset'); $('t_footer').textContent=tr('footer');
  ['tab0','tab1','tab2'].forEach((t,i)=>$(t).innerHTML=`<span class="num" style="display:inline-block;background:var(--brand-soft);border-radius:50%;width:20px;height:20px;line-height:20px;text-align:center;font-size:11px;margin-inline-end:6px">${i+1}</span>`+tr('tab'+i));
  Object.keys(T).filter(k=>k.startsWith('h_')||k.startsWith('cp_')).forEach(k=>{const e=$(k);if(e)e.textContent=tr(k);});
}
function refresh(){RENDER[pageIdx](rowsF());}
function showPage(i){
  pageIdx=(i+3)%3;
  document.querySelectorAll('.page').forEach((p,j)=>p.classList.toggle('active',j===pageIdx));
  document.querySelectorAll('.tabs .tab').forEach((t,j)=>t.classList.toggle('active',j===pageIdx));
  refresh();
}
document.querySelectorAll('.tabs .tab').forEach(t=>t.onclick=()=>showPage(+t.dataset.p));
$('prevPg').onclick=()=>showPage(pageIdx-1);
$('nextPg').onclick=()=>showPage(pageIdx+1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')showPage(pageIdx+1);if(e.key==='ArrowLeft')showPage(pageIdx-1);});
$('fMonth').onchange=e=>{F.m=e.target.value;refresh();};
$('fGov').onchange=e=>{F.g=e.target.value;refresh();};
$('fPt').onchange=e=>{F.p=e.target.value;refresh();};
$('btnReset').onclick=()=>{F={m:"",g:"",p:""};fillFilters();refresh();};
function updateAssessmentLink(){
  const q=new URLSearchParams({lang:LANG,theme:THEME}).toString();
  $('assessmentLink').href='/?'+q;
  $('assessmentLink').textContent=LANG==='ar'?'تقييم التمويل':'Assessment';
}
function setTheme(theme,persist=true){
  THEME=['light','dark','cb'].includes(theme)?theme:'light';
  document.body.dataset.theme=THEME;
  document.querySelectorAll('#themeSeg button').forEach(x=>x.classList.toggle('active',x.dataset.t===THEME));
  if(persist)localStorage.setItem(THEME_KEY,THEME);
  updateAssessmentLink();
  refresh();
}
function setLanguage(lang,persist=true){
  LANG=lang==='ar'?'ar':'en';
  document.body.dir = LANG==='ar' ? 'rtl' : 'ltr';
  document.documentElement.lang = LANG;
  document.querySelectorAll('#langSeg button').forEach(x=>x.classList.toggle('active',x.dataset.l===LANG));
  if(persist)localStorage.setItem(LANG_KEY,LANG);
  updateAssessmentLink();
  applyStatic(); fillFilters(); refresh();
}
document.querySelectorAll('#themeSeg button').forEach(b=>b.onclick=()=>setTheme(b.dataset.t));
document.querySelectorAll('#langSeg button').forEach(b=>b.onclick=()=>setLanguage(b.dataset.l));
const params=new URLSearchParams(location.search);
THEME=params.get('theme')||localStorage.getItem(THEME_KEY)||'light';
LANG=params.get('lang')||localStorage.getItem(LANG_KEY)||'en';
document.body.dataset.theme=['light','dark','cb'].includes(THEME)?THEME:'light';
document.body.dir=LANG==='ar'?'rtl':'ltr';
document.documentElement.lang=LANG;
document.querySelectorAll('#themeSeg button').forEach(x=>x.classList.toggle('active',x.dataset.t===THEME));
document.querySelectorAll('#langSeg button').forEach(x=>x.classList.toggle('active',x.dataset.l===LANG));
updateAssessmentLink(); applyStatic(); fillFilters(); refresh();

</script>
